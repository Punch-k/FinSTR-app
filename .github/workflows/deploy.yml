# Builds the market snapshot and publishes the site to GitHub Pages.
#
# The data is generated fresh on every run and deployed as a Pages artifact, so it is
# never committed to the repository (no data commits, no repo growth).
# Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions".

name: Build and deploy FinSTR

on:
  # Data refreshes hourly on US trading days: 10:30 to 15:30 New York time, plus 16:20 after the close.
  # GitHub often starts scheduled jobs hours late, so the workflow is triggered hourly
  # (and by an outside timer, see docs/SCHEDULER.md); the "gate" job below rebuilds only
  # when the live snapshot is older than the latest refresh slot, so extra triggers cost ~20s.
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the live data is already current"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Is a refresh due?
        env:
          FINSTR_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FINSTR_FORCE: ${{ github.event_name == 'push' || inputs.force == true }}
        run: python3 pipeline/freshness.py

  build:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Work out this site's address (so forks publish under their own)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: echo "FINSTR_SITE=https://${OWNER,,}.github.io/${REPO}" >> "$GITHUB_ENV"

      - name: Restore the backup copy of the live signal record
        uses: actions/cache/restore@v4
        with:
          path: .track-cache
          key: track-${{ github.run_id }}
          restore-keys: track-

      - name: Fetch market data (S&P 500, markets, news)
        env:
          FINSTR_TRACK_CACHE: .track-cache/track.json
          # keep-last-good: tickers that fail this run reuse the currently published values
          FINSTR_PREVIOUS_URL: ${{ env.FINSTR_SITE }}
        run: python pipeline/fetch.py

      - name: Keep a backup copy of the live signal record
        run: mkdir -p .track-cache && cp data/track.json .track-cache/track.json

      - name: Save the backup copy
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .track-cache
          key: track-${{ github.run_id }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html llms.txt privacy.html terms.html _site/
          cp -r assets data _site/
          python pipeline/pages.py --data data --out _site   # per-stock pages, sitemap, robots
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
