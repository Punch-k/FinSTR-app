name: Update screener data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "yfinance>=1.5.1"

      - name: Fetch screener + news data
        run: python scripts/fetch_data.py

      - name: Install Quant Desk dependencies
        run: pip install -r requirements.txt

      - name: Install Kronos (best-effort; heuristic fallback engages if this fails)
        run: pip install "git+https://github.com/shiyu-coder/Kronos.git@master"
        continue-on-error: true

      - name: Run Quant Desk cycle (forecast -> allocate -> paper-simulate)
        run: python -m quant.run_quant_cycle
        continue-on-error: true  # heavy ML deps (torch/Kronos/nautilus_trader) are best-effort on a
                                  # free-tier runner; a failure here must never block the screener data commit

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.json data/meta.json
          # quant/run_quant_cycle.py runs with continue-on-error above, so its
          # outputs may not exist on a run where the heavy ML deps failed to install.
          [ -f data/quant_snapshot.json ] && git add data/quant_snapshot.json
          [ -f database/quant.db ] && git add database/quant.db
          git diff --cached --quiet || git commit -m "Update screener + quant desk data"
          git push
